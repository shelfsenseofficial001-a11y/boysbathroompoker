<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060b09" />
  <title>No such table · Boysbathroom Poker</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <!-- Served from this machine, like the rest of the game: a wrong turn
       should not be the one page that needs the internet. -->
  <link rel="stylesheet" href="/src/assets/css/fonts.css" />
  <link rel="stylesheet" href="/src/assets/css/spread.css" />
  <style>
    :root {
      --bg-0: #060b09;
      --text-1: #f2f4f1;
      --text-2: #aeb6b0;
      --text-3: #7c867f;
      --gold: #e6b450;
      --gold-hi: #f7d58a;
      --line-2: rgba(255, 255, 255, 0.12);
      --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Bodoni Moda', 'Didot', Georgia, 'Times New Roman', serif;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font-ui);
      color: var(--text-1);
      background:
        radial-gradient(ellipse 120% 80% at 50% 8%, #10241c 0%, transparent 62%),
        radial-gradient(ellipse 90% 60% at 50% 100%, #0b1a14 0%, transparent 70%),
        var(--bg-0);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(18px, 4vh, 34px);
      padding: 28px 20px;
      overflow: hidden;
      text-align: center;
    }

    /* ---------- The words ---------- */
    .say { max-width: 34rem; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .kicker {
      font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--gold); opacity: 0.85;
    }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(28px, 6vw, 46px);
      line-height: 1.1;
      color: var(--text-1);
    }
    p { margin: 0; font-size: clamp(13.5px, 2.4vw, 15.5px); line-height: 1.55; color: var(--text-2); }
    .home {
      margin-top: 6px;
      display: inline-flex; align-items: center; gap: 9px;
      height: 46px; padding: 0 22px; border-radius: 999px;
      border: 1px solid transparent; cursor: pointer; text-decoration: none;
      background: linear-gradient(180deg, var(--gold-hi), var(--gold));
      color: #2a1c05; font: 800 14px/1 var(--font-ui); letter-spacing: 0.04em;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5);
      transition: transform 0.14s var(--ease-out-expo), filter 0.16s;
    }
    .home:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .home:active { transform: scale(0.97); }
    .home svg { width: 16px; height: 16px; }
    .say, .home { animation: riseIn 0.7s var(--ease-out-expo) 0.5s both; }
    @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } }

    /* The reduce-motion rule the rest of the game keeps. The spread brings
       its own; this covers the words. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="spread" id="spread" aria-label="404" role="img"></div>

  <div class="say">
    <span class="kicker">404 &middot; Dead hand</span>
    <h1>There's no table here.</h1>
    <p>Whatever you were looking for has been mucked. The game is still running &mdash; the door back to it is right below.</p>
    <a class="home" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M11 18l-6-6 6-6" />
      </svg>
      Back to the lobby
    </a>
  </div>

  <script type="module">
    import { dealFigures, followPointer } from '/src/lib/svg/spread.js';

    const spread = document.getElementById('spread');
    dealFigures(spread, '404');
    followPointer(spread);
  </script>
</body>
</html>
