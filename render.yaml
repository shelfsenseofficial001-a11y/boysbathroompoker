# Render blueprint: one always-on Node process serving the static files, the
# REST endpoints and the Socket.IO connection the table runs on.
#
# Netlify and friends can't host this: the game keeps every live table in
# memory and talks to players over a WebSocket held open for the whole hand,
# which needs a real process rather than a static CDN or a serverless function.
#
# To deploy: push this repo to GitHub, then on Render pick
# New > Blueprint and point it at the repo. Everything below is applied for you.
services:
  - type: web
    name: boysbathroompoker
    runtime: node
    # Paid, and it has to be: the disk below is what keeps the database - and
    # so every player's match history - across a restart, and Render offers
    # no disk on the free plan. Dropping back to `free` means dropping the
    # disk with it, and stats resetting on every deploy.
    plan: starter
    # The Vue client is built here; the Node process then serves dist/.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # "/" serves index.html, so a 200 here means the app is really up.
    healthCheckPath: /
    envVars:
      # better-sqlite3 is a native module and is compiled during the build, so
      # the Node version is pinned to the one the lockfile was resolved with.
      - key: NODE_VERSION
        value: 22.13.1
      # Generated once by Render and kept thereafter; never commit a real one.
      - key: SESSION_SECRET
        generateValue: true
      # Auth bypass, development only. The server refuses to start if this is
      # "true" while NODE_ENV=production, so it stays false here.
      - key: SKIP_AUTH
        value: "false"
      # Supabase. Set each of these in the Render dashboard - sync: false keeps
      # the values out of this file and out of the repository.
      #
      # The two VITE_ values are read at build time and end up in the bundle,
      # which is what the anon key is for. The server-side pair verifies the
      # token a socket connects with: the JWT secret verifies locally with no
      # network call, URL + anon key is the fallback.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_AUTH_EMAIL_DOMAIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # On the disk below rather than in the service's own filesystem, which
      # is rebuilt from the image on every restart and redeploy.
      - key: DB_FILE
        value: /var/data/poker.db

    # Where the database actually lives.
    #
    # This used to be a comment explaining that the free plan has no disk and
    # that losing data/poker.db cost nothing - true when the database held
    # only throwaway guest rows and finished hands nobody read. It stopped
    # being true when profiles grew a match history: `game_results` is what
    # the stats pages are drawn from, so a restart wiping it is a player
    # watching their record reset for no reason they can see.
    #
    # A disk needs a paid instance, which is why `plan` above is starter
    # rather than free. The two go together: neither is any use alone.
    disk:
      name: poker-data
      mountPath: /var/data
      sizeGB: 1
